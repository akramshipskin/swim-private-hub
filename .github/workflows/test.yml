name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ponytail: npm install, bukan npm ci -- lock buatan macOS tidak mencatat
      # @emnapi/* yang dibutuhkan @img/sharp-wasm32 di Linux, jadi npm ci menolak.
      # Sama dengan cara Vercel memasang dependensi. Ganti ke npm ci kalau lock
      # sudah dibuat ulang dan npm ci lolos di Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # Tipe rute/layout (LayoutProps, PageProps) dibuat Next, bukan di-commit.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
