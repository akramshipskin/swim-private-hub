name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Tipe rute/layout (LayoutProps, PageProps) dibuat Next, bukan di-commit.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
