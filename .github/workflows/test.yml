name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Tipe rute/layout (LayoutProps, PageProps) dibuat Next, bukan di-commit.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Build production: menangkap error yang lolos tsc/lint (import rusak, halaman gagal render).
      - run: npm run build

  # Tes race condition terhadap Postgres sungguhan (bukan mock): uang, booking,
  # pendaftaran. Postgres 17 = versi production; port 54329 dan user/password
  # qa/qa sama dengan yang dipaku vitest.race.config.ts dan tests/race/setup.ts.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: race
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U qa -d race"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Skema lewat migrasi asli (bukan db push), sama seperti production.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://qa:qa@localhost:54329/race
          DIRECT_URL: postgresql://qa:qa@localhost:54329/race
      - run: npm run test:race
